name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Workspace & Extract Source
      run: |
        echo "=== 1. Inspecting workspace ==="
        ls -la

        # If user uploaded a ZIP file, extract it
        if ls *.zip 1> /dev/null 2>&1; then
          echo "Found ZIP archive. Extracting..."
          unzip -q -o *.zip
        fi

        # Find where settings.gradle.kts or settings.gradle is located
        SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

        # If not found, download package from live cloud app
        if [ -z "$SETTINGS_PATH" ]; then
          echo "No source files found in repo. Fetching from live cloud app..."
          curl -sSL "https://ais-dev-d6fhoqhhoyx2irzeoczsid-976446326278.asia-east1.run.app/ChandraVehicleClearance-Android.zip" -o download_pkg.zip
          unzip -q -o download_pkg.zip
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        fi

        # If project is located in a subfolder, bring all files into root
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        if [ "$PROJECT_DIR" != "." ]; then
          echo "Moving files from subfolder $PROJECT_DIR to repository root..."
          cp -rn "$PROJECT_DIR"/* . || cp -r "$PROJECT_DIR"/* .
        fi

        echo "=== 2. Workspace root ready ==="
        ls -la
        ls -la app/ || true

    - name: Set up Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Android APK
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x ./gradlew

        echo "=== Compiling Debug APK ==="
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Verify APK Output
      run: |
        echo "=== Generated APK Files ==="
        find . -name "*.apk" -ls

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChandraVehicleClearance-APK
        path: "app/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        retention-days: 30
